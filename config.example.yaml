# WarnFlux configuration example.
# Copy to config.yaml and adjust it for your environment.
#
# INSTALLING IN ANOTHER REGION — every per-region knob, in one place:
#   1. aprs.callsign / name / gridsquare / latitude / longitude / radius_km
#      — the geographic master: the APRS-IS range filter, the geo-scoped
#      sources and the home maps all inherit this position + radius.
#   2. sources.weather-home.config.locations — towns for the weather cards
#      (global source).
#   3. sources.metar-*.config.stations — airport ICAO codes + display names
#      (global source; the feed carries each airport's position).
#   4. sources.adsb-main — aircraft in the hub's area of interest; the
#      center/radius inherit the aprs section (global source; adsblol or a
#      local tar1090 receiver).
#   5. Poland-specific sources (leave disabled outside Poland):
#      imgw-warnings (TERYT geography + hydro keywords),
#      rso-* (voivodeships + filter.local),
#      gddkia-roads, gios-awarie (both inherit the aprs area).
#   6. web.about / disclaimer / domain / title — branding texts.
#   7. outputs + dispatch — MQTT broker and unique client IDs.
#   8. actions — SMTP credentials, APRS recipients, webhook URLs.

app:
  # One of: debug, info, warn, error.
  log_level: info

  # IANA timezone used for every human-facing timestamp (admin panels,
  # message history). Containers usually run UTC — without this, panel
  # times lag the local wall clock. Empty = the process-local zone.
  timezone: Europe/Warsaw

  # Optional rotating log file; empty means log to stdout only.
  # In Docker, point this at the mounted volume, e.g. /logs/warnflux.log.
  log_file: ""

  # Rotate the log file once it grows beyond this size (megabytes).
  log_max_size_mb: 10

  # How many rotated log files to keep.
  log_max_backups: 5

  # How often to check for and mark expired events, e.g. 1m, 30s.
  expiration_interval: 1m

  # How long acknowledged journal records are kept before deletion,
  # e.g. 24h. Must be > 0.
  change_retention: 24h

  # How long cancelled/expired current-state records are kept in the
  # events table, e.g. 4320h (180 days, matching the public home-page
  # Archive tab). Active events are never cleaned.
  event_retention: 4320h

  # How long action-fire ledger rows are kept before pruning. Only
  # COMPLETED delivery history ages out: pending jobs (saved, running,
  # scheduled retries) survive retention — they bound the dedup window
  # and a replayed event can fire again only after its row expires.
  # Negative = never prune (ledger grows forever).
  notification_retention: 720h

storage:
  # The only supported driver for now.
  driver: sqlite

  # Local development. If path is omitted entirely, WarnFlux warns and
  # creates warnflux.db next to the binary (dev/debug convenience).
  # In Docker, always set it explicitly, e.g. /data/warnflux.db.
  path: ./warnflux.db

  # Low-disk alarm threshold in megabytes: below it the health page turns
  # red, /metrics reports the free space and the dispatch inbox retention
  # shortens (auxiliary data stops competing with primary storage on a
  # full card). 0 disables the alarm and the aggressive retention.
  min_free_mb: 100

# Installation geography: extends the bundled TERYT table with territorial
# units of this region. Use it to reference units that are not shipped with
# the binary (e.g. a different voivodeship) in imgw.geography.include,
# rso filter.local and compose areas. Declaration order matters: parents
# must be declared before children unless they are bundled. Codes are
# official TERYT numeric codes (padded to 7 digits).
#
# geo:
#   areas:
#     - code: "1200000"   # województwo małopolskie
#       type: wojewodztwo
#       slug: malopolskie-example
#       name: Małopolskie
#     - code: "1219000"   # powiat krakowski
#       type: powiat
#       slug: your-powiat
#       name: Your Powiat
#       parents: ["malopolskie-example"]
#     - code: "1219043"   # gmina (example TERYT code)
#       type: gmina
#       slug: your-town
#       name: Your Town
#       parents: ["your-powiat"]

# Source plugins: ingest hazard information and emit normalized events.
# Each instance's config.poll_interval is also editable on the Config page
# ("Polling and range"), where the accepted range of its plugin is shown;
# the value is read at startup, so a change applies after a restart.
sources:
  # Open-Meteo INFORMATIONAL weather source: publishes ordinary weather
  # snapshots to retained MQTT information topics
  # (<topic_prefix>/info/openmeteo/<producer_id>/<location_id>/weather).
  # It does NOT generate HazardEvents. See
  # internal/plugins/sources/openmeteo/README.md and docs/weather-schema.md.
  - id: weather-home
    type: openmeteo
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 30m
      request_timeout: 10s

      forecast_hours: 48
      forecast_days: 7

      # Per-location European-AQI snapshots (Open-Meteo air-quality
      # API): published on the same air_quality information kind the
      # GIOŚ station layer uses, so the home map renders town air quality
      # next to the official stations. One extra request per location.
      air_quality: false

      api_key: ""
      api_key_file: ""

      # Per-region weather cards: the towns this installation covers.
      locations:
        - id: home
          name: Home
          latitude: 50.0000
          longitude: 20.0000
          # air_quality: false  # per-location opt-out when an official
          #                      # station already covers the town

  # METAR aviation weather source (NOAA Aviation Weather Center):
  # publishes current airport observations as informational weather
  # snapshots (no HazardEvents). The feed carries each station's
  # position, so the airport appears on the weather map automatically —
  # no coordinates needed.
  - id: metar-epkk
    type: metar
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 15m
      request_timeout: 10s
      # base_url: "https://aviationweather.gov/api/data"

      stations:
        - id: EPKK
          name: "Kraków Balice (EPKK)"
          timezone: "Europe/Warsaw"

  # ADS-B aircraft traffic in the hub's area of interest. Two providers:
  #   - adsblol: free keyless internet API (rate-limited to ~1 req/10s);
  #   - tar1090: a LOCAL readsb/tar1090 receiver (base_url points at it),
  #     which keeps aircraft visibility without an internet uplink.
  # The area center and radius inherit the APRS hub (override with
  # latitude/longitude/radius_km). Published as kind=aircraft info topics.
  - id: adsb-main
    type: adsb
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      provider: adsblol
      # base_url: "https://api.adsb.lol"      # or http://10.0.0.20:8080 for tar1090
      # Polite anonymous rate limit (plugin also honors 429 Retry-After).
      poll_interval: 60s
      request_timeout: 15s
      track_window: 5m

  # IMGW-PIB public warnings: a real HAZARD source consuming the official
  # warningsmeteo and warningshydro feeds with full-snapshot disappearance
  # reconciliation (see internal/plugins/sources/imgw/README.md).
  # Data source: Instytut Meteorologii i Gospodarki Wodnej – Państwowy
  # Instytut Badawczy (IMGW-PIB); https://danepubliczne.imgw.pl/apiinfo.
  # POLAND-ONLY: leave disabled outside Poland.
  - id: imgw-warnings
    type: imgw
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the data API base (testing/custom deployments).
      # base_url: https://danepubliczne.imgw.pl/api/data

      # Feeds to consume: meteo, hydro, or both. Omitted → both.
      feeds:
        - meteo
        - hydro

      # Optional geographic filtering: only warnings whose TERYT areas
      # intersect the configured target units are emitted (hierarchical
      # matching). Filtered warnings never make the provider snapshot
      # incomplete; a warning whose areas stop intersecting the target is
      # reconciled/cancelled by the next complete snapshot. Unknown
      # configured names fail startup — fill the units in before enabling
      # (see the geo.areas block above).
      geography:
        enabled: false
        # include:
        #   - gmina:your-town
        # Local surface waters / places that make a hydrological warning
        # locally relevant. Keywords are regexp fragments (plain words
        # work too). Omit or leave empty to pass all hydro warnings
        # through.
        hydro_local_keywords: []

  # Regionalny System Ostrzegania (RSO) public XML communications:
  # a HAZARD source with upstream voivodeship filtering via the official
  # endpoint (see internal/plugins/sources/rso/README.md).
  # Source: RSO / TVP, https://www.komunikaty.tvp.pl/Info/Integration.
  # POLAND-ONLY: leave disabled outside Poland.
  - id: rso-malopolskie
    type: rso
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the portal base (testing/custom deployments).
      # base_url: https://komunikaty.tvp.pl

      # One or more official RSO voivodeship slugs; omitted → [wszystkie].
      # "wszystkie" is exclusive (cannot be combined with regional slugs).
      voivodeships:
        - malopolskie

      # Optional high-signal policy: suppress RCB and air-quality
      # communications, collapse plain IMGW duplicates, classify severity
      # from explicit wording (never from rso_alarm) and apply the
      # installation-geography thresholds (filter.local + corridor).
      # Filtered items never make the provider snapshot incomplete.
      filter:
        high_signal_only: true
        exclude_rcb: true
        exclude_air_quality: true
        suppress_imgw_duplicates: true
        local_min_severity: moderate
        regional_min_severity: severe
        # Optional kilometre-window corridor (enabled + km_from < km_to);
        # matched only when local.roads is non-empty. Disabled when
        # omitted. Legacy alias: a4_corridor.
        # corridor:
        #   enabled: true
        #   km_from: 400
        #   km_to: 503

        # Installation geography: everything is config-driven, nothing
        # regional is hardcoded in the binary. Keywords are regexp
        # fragments (plain words work too); places map keywords to the
        # area tokens emitted on the event. Omit local entirely for
        # regional-only filtering.
        local:
          core_keywords:
            - "your-town\\w*"
          powiat_keywords: []
          nearby_keywords: []
          places:
            your-town:
              keywords: ["your-town\\w*"]
              areas: ["gmina:your-town"]
          roads: []
          severe_roads: []
          corridor_keywords: []
          core_areas: ["gmina:your-town"]
          corridor_area: ""

  # GDDKiA national-roads difficulties feed: road works, alternating
  # traffic and closures, filtered to the configured area (the APRS hub
  # position + radius; both overridable below). Every entry carries
  # coordinates, so the home map draws them as warning icons.
  # POLAND-ONLY: leave disabled outside Poland.
  # - id: gddkia-roads
  #   type: gddkia
  #   enabled: true
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     poll_interval: 15m
  #     request_timeout: 10s
  #     # Area = aprs.latitude/longitude + aprs.radius_km; override with
  #     # radius_km, center_latitude, center_longitude.

  # GIOŚ serious-industrial-accident register (poważne awarie):
  # current-year accidents, filtered by voivodeship first (auto-derived
  # from the home position when not set), then geocoded to the locality
  # centroid (GUGiK ULDK) and radius-filtered. Event types:
  # INDUSTRIAL_ACCIDENT, CHEMICAL_RELEASE (rodzajZdarzenia emisja/wyciek).
  # POLAND-ONLY: leave disabled outside Poland.
  # - id: gios-awarie
  #   type: gios
  #   enabled: true
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     poll_interval: 6h
  #     request_timeout: 10s
  #     # One of the 16 provider voivodeship names. Empty = derived once
  #     # from the aprs position (reverse geocoding).
  #     wojewodztwo: małopolskie
  #     # powiat: wielicki
  #     # rok: 0          # 0 = the current year

  # GIOŚ air-quality exceedance feed (official Chief Inspectorate of
  # Environmental Protection API): active exceedances of the information,
  # alarm, admissible and target levels (PM10, PM2.5, O3, SO2, NO2, ...).
  # One record becomes one hazard event (category environment) with the
  # official norm type mapped onto a canonical severity; records carry
  # the affected zone, and the station directory geocodes them for the
  # home map. The feed is a paginated history, so only records newer
  # than max_age become alerts. POLAND-ONLY.
  # - id: giosaq-main
  #   type: giosaq
  #   enabled: true
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     # The levels endpoint allows 2 requests/minute: 5m is plenty.
  #     poll_interval: 5m
  #     request_timeout: 20s
  #     # Only records newer than this become alerts; 0 = no cutoff.
  #     max_age: 24h
  #     # Zone-name substrings (case-insensitive); empty = every zone.
  #     zones: ["strefa małopolska", "aglomeracja krakowska"]
  #     # Norm-type keyword -> canonical severity mapping.
  #     alarm_severity: severe     # "alarmowy" (alarm level)
  #     info_severity: moderate    # "informowania" (information level)
  #     limit_severity: minor      # "dopuszczalnego"/"docelowego"
  #     # Station-directory (coordinates) refresh; 0 = never.
  #     stations_refresh: 24h
  #
  #     # Air-quality index layer: publish the official per-station index
  #     # (aqindex) for the stations inside the aprs.area radius as an
  #     # informational "air_quality" layer on the home map. Requires
  #     # aprs.enabled with area_latitude/area_longitude/area_radius_km.
  #     air_index: true
  #     # Index refresh cadence; one request per station per poll.
  #     station_poll_interval: 15m
  #     # Only stations within this many kilometres of the area centre
  #     # are published (default: aprs.area_radius_km).
  #     station_radius_km: 35
  #     # Area-centre overrides (default: aprs area).
  #     # center_lat: 50.0562
  #     # center_lon: 20.0610

  # APRS-IS source: connects to an APRS-IS server, subscribes to packets
  # around the configured position (aprs.gridsquare + aprs.radius_km) and
  # feeds them into the shared APRS hub, which publishes the merged
  # station state, the packet feed and messages addressed to our callsign
  # on MQTT. Requires aprs.enabled: true.
  #
  # The plugin also TRANSMITS: the aprs action below (and future rule
  # wiring) sends APRS text messages to hams through this connection.
  # See internal/plugins/sources/aprsinet/README.md.
  #
  # - id: aprs-inet-main
  #   type: aprs-inet
  #   enabled: false
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     # Login callsign. Defaults to aprs.callsign; must be validated
  #     # with the passcode on the APRS-IS server.
  #     callsign: "SP9MOA-10"
  #
  #     # APRS-IS validation code: passcode OR passcode_file.
  #     passcode: "12345"
  #     passcode_file: ""
  #
  #     # APRS-IS server (host:port). Tier-2 rotate default.
  #     server: "rotate.aprs2.net:14580"
  #
  #     # Optional filter override; the default is the automatic range
  #     # filter r/<lat>/<lon>/<radius_km> built from the aprs section.
  #     filter: ""
  #
  #     connect_timeout: 15s
  #     read_timeout: 10m

  # KISS radio backend: connects to a KISS TNC server over plain TCP
  # (Direwolf, aprsd, a hardware TNC bridge...) and feeds every decoded
  # frame into the shared APRS hub; while connected it also acts as the
  # outbound transmitter for APRS messages. Requires aprs.enabled: true.
  # Both backends run in parallel and complement each other: RF-heard
  # packets enrich the APRS-IS view, and outbound messages prefer the
  # radio for radio-heard stations (falling back to APRS-IS when the TNC
  # is down or the station is internet-only).
  # See internal/plugins/sources/aprsradio/README.md.
  #
  # - id: aprs-radio-main
  #   type: aprs-radio
  #   enabled: false
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     # KISS server address (host:port). Required.
  #     server: "127.0.0.1:8001"
  #
  #     # Digipeater path used for outbound frames.
  #     path: ["WIDE1-1"]
  #
  #     connect_timeout: 15s
  #     # One read from the TNC may take this long. A timeout is NOT an
  #     # error: a quiet channel sends nothing for long stretches, so the
  #     # session stays connected. It reconnects only when no frame
  #     # arrives for 3x read_timeout (dead TNC detection).
  #     read_timeout: 10m
  #     max_frame_bytes: 2048

# Output plugins: receive meaningful event changes from the core.
outputs:
  # Publishes hazard event changes and an application status snapshot to
  # MQTT. This is the only built-in output.
  - id: mqtt-main
    type: mqtt
    enabled: false

    runtime:
      timeout: 10s
      failure_threshold: 5

    config:
      # Broker URL, e.g. tcp://localhost:1883 or ssl://broker.example.com:8883.
      broker: tcp://localhost:1883
      # Required: every WarnFlux instance needs its own client ID
      # (two instances sharing one will kick each other off the broker).
      client_id: warnflux-home
      username: ""
      # Plaintext password, mutually exclusive with password_file.
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""
      # Event changes are published to <topic_prefix>/events; the status
      # snapshot (retained) goes to <topic_prefix>/status.
      topic_prefix: warnflux
      # QoS for event messages: 1 or 2. QoS 0 is rejected because it would
      # downgrade hazard delivery to best effort.
      qos: 1
      # Interval between retained status snapshots, e.g. 30s. Set to 0 to
      # disable periodic status publication.
      heartbeat_interval: 30s

# Dispatch subsystem: one canonical bounded ingress plus independent MQTT
# receiver clients (INPUT). The receiver clients are deliberately separate
# from outputs[].type=mqtt (the Router publisher): the publisher delivers
# Router state/events to a broker, receivers consume MQTT frames for
# dispatch. They MAY connect to the same broker but MUST use different
# client IDs.
dispatch:
  # Bounded canonical dispatch intake queue; a full queue drops events
  # (counted and logged) until the durable rule engine exists.
  queue_size: 1024

  # One durable inbox write inside Enqueue is bounded by this deadline: a
  # database that stalls longer degrades the event to EMERGENCY
  # acceptance (delivered now, visible on the health page, lost on
  # restart) instead of blocking the receiver callback.
  inbox_write_timeout: 2s

  # Pending-message validity policy for the durable inbox: rows older
  # than this are removed ONLY when their hazard's authoritative expiry
  # has already passed (the staleness gates would suppress them anyway);
  # every removal is an explicit audited outcome. Messages without an
  # expiry are never aged out. Below storage.min_free_mb the cutoff
  # shortens to 5 minutes. 0 disables pruning.
  inbox_retention: 24h

  mqtt_receivers:

    # Local receiver: consumes the local WarnFlux MQTT contract and
    # arbitrary local topics through the same canonical ingress.
    - id: local
      enabled: true

      broker: tcp://mosquitto:1883
      client_id: warnflux-dispatch-local

      username: ""
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""

      connect_timeout: 10s
      keep_alive: 30s

      # Session durability. false (default) = PERSISTENT session: the
      # broker keeps the subscriptions and queues QoS≥1 messages while
      # this receiver is disconnected, so the non-retained /events stream
      # survives receiver outages (redelivered on reconnect; the routing
      # ledger deduplicates repeats). true = clean session: missed
      # messages while disconnected are gone forever.
      clean_session: false

      # WarnFlux protocol mode: automatically subscribes
      # <prefix>/events, <prefix>/active/#, <prefix>/info/#, <prefix>/status
      # and parses them with the strict wire protocol.
      warnflux:
        enabled: true
        topic_prefix: warnflux

      # Generic MQTT subscriptions (standard MQTT wildcard semantics).
      subscriptions:
        - topic: "home/#"
          qos: 1

# Publish mask: which document families WarnFlux publishes to the MQTT
# broker. Uncheck noisy families to cut broker traffic and CPU. Changes
# on the admin Config page apply IMMEDIATELY at runtime; this block is
# the startup state. Default: everything enabled. The topic families:
#   events            — <prefix>/events hazard-transition journal
#   active            — <prefix>/active/<source>/<hash> + <prefix>/active-list
#   info              — <prefix>/info/... (source information messages:
#                       forecasts and observations (weather), EMCOM states)
#   status            — <prefix>/status station heartbeat (the last-will
#                       "offline" message always stays on — it is the
#                       broker-side crash detector)
#   aprs_stations     — <prefix>/aprs/stations/<callsign>
#   aprs_bulletins    — <prefix>/aprs/bulletins/...
#   aprs_packets      — <prefix>/aprs/packets (the noisiest feed: one
#                       document per received packet)
#   aprs_messages     — <prefix>/aprs/messages (rx and tx)
#   meshtastic_stations — <prefix>/meshtastic/stations/<node-id>
#   meshtastic_messages — <prefix>/meshtastic/messages
#   gsm_messages     — <prefix>/gsm/messages (received and sent SMS)
#
# The default is the QUIET mask: the hazard-transition stream (/events)
# plus every retained current-state document. The per-packet and
# per-message mirrors are opt-in — the dispatch pipeline consumes those
# internally and the admin history pages read the database, so nothing
# local depends on them reaching the broker.
mqtt_publish:
  events: true
  active: true
  info: true
  status: true
  aprs_stations: true
  aprs_bulletins: true
  aprs_packets: false
  aprs_messages: false
  meshtastic_stations: true
  meshtastic_messages: false
  gsm_messages: false

# Authenticated admin web UI (server-rendered, embedded assets, no CDN).
web:
  enabled: true
  listen: ":8080"
  # The web UI includes a built-in /test page: any logged-in user can
  # emit a synthetic hazard transition (severity/urgency/certainty) into
  # the dispatch ingress to exercise the group routing paths.

  # Application name: browser title and footer. Set it to your
  # instance's brand (e.g. SOSNA).
  title: "WarnFlux"

  # System name shown next to the logo on the login page and in the
  # sidebar header. Defaults to the title.
  name: ""

  # Branding shown next to the logo (sidebar) and on the login page.
  # header1 defaults to the name; header2 is an optional subtitle.
  # The header1 value also rides along as the SMTP subject bracket
  # (e.g. "[SOSNA]") and the APRS message prefix.
  header1: ""
  header2: ""

  # Optional one-line motto rendered in the footer on every page.
  tagline: "od społeczności • dla mieszkańców • w trosce o bezpieczeństwo"

  # Optional longer text shown on the public page as a one-time popup
  # (re-opened any time from the question-mark button in the top bar).
  # Markdown subset: headings (#), emphasis (**bold**, *italic*),
  # lists (-), fenced code (```) and links [text](https://…) — links
  # always open in a new tab. Leave empty to hide the popup and the
  # button.
  about: |
    # SOSNA — Społeczny Otwarty System Notyfikacji i Alertów

    Krótka informacja o systemie: czym jest, jaki jest zakres
    działania, skąd pochodzą komunikaty i jak je interpretować.

    - Zbieramy komunikaty z oficjalnych źródeł (IMGW, RSO, GDDKiA).
    - Porządkujemy je i pokazujemy na liście oraz na mapie sytuacyjnej.
    - Rozsyłamy alerty e-mailem, przez APRS i sieć Meshtastic.

    Więcej: [sp9moa.pl](https://sp9moa.pl)

  # Optional notice rendered prominently above the public hazard list,
  # e.g. that the system is unofficial and does not replace official
  # channels. Plain text; line breaks are preserved. Empty hides it.
  disclaimer: |
    Ten system ma charakter pomocniczy — nie zastępuje oficjalnej
    komunikacji rządowej ani numerów alarmowych.

  # Public domain this instance is served under (host, optional port).
  # Used for absolute deep links in notifications AND as the canonical
  # origin of password-reset links. No scheme, no path.
  # Security: reset links are built ONLY from this domain, never from
  # the request Host header (a spoofed Host must not redirect a reset
  # to a foreign domain). Empty disables deep links AND the self-service
  # email reset (recovery stays with an administrator on the machine).
  domain: "sosna.sp9moa.pl"

  # Offline mode: the startup state of the station's offline switch (an
  # admin toggles the same switch at runtime on the admin Config page,
  # changes apply immediately). When on, WarnFlux suspends EVERY
  # internet-backed source (imgw, openmeteo, rso, gios, giosaq, gddkia,
  # metar, adsb, aprs-inet) and holds internet-backed actions (smtp,
  # http_webhook, discord), and the maps use the local tile tree below.
  # Local functions keep working off-grid: SQLite, the local MQTT broker,
  # the APRS radio, Meshtastic and the radio routing.
  offline_mode: false

  # Local map tiles for offline mode: a directory with a pre-generated
  # Leaflet raster tile tree ({z}/{x}/{y}.jpg — e.g. the build/WF_Map
  # bundle). The station serves it under /tiles/ and the maps use it
  # while offline. Empty disables local tiles (maps then need internet).
  # Point it at a mounted volume (e.g. /data/tiles) so every operator
  # can drop in their own tiles without rebuilding the container.
  tiles_dir: ""

  # Force the local tile tree on EVERY map even while the station is
  # online (startup state; the admin Config page toggles the same switch
  # at runtime and writes it back here, so it survives restarts).
  force_local_tiles: false

  # Main system language of BROADCAST notifications: APRS messages and
  # EMCOM group-channel Meshtastic posts are sent in this language.
  # One of "en", "pl" (empty = English). The admin can switch it at
  # runtime on the Config page. Personal messages (email, direct
  # Meshtastic messages) use each recipient's own language choice from
  # the user directory instead.
  system_language: ""

  auth:
    # The admin account is ALWAYS configured here (or via password_file):
    # on startup WarnFlux seeds the read-only admin row in the user
    # directory from this block and keeps its stored password in sync
    # with it. Changing the password here takes effect on restart.
    username: admin
    password: change-me
    # Alternatively, read the password from a file (e.g. a Docker secret).
    # Mutually exclusive with password.
    password_file: ""

    # Set to true when serving behind TLS (session cookie becomes Secure).
    secure_cookie: false

    # Trusted reverse proxies (single IPs or CIDRs). Only requests whose
    # direct peer matches one of these may carry X-Forwarded-For: the
    # client IP used by the rate limiters then comes from the header,
    # analyzed from the RIGHT (the proxy appends the client it saw last,
    # so a client-controlled prefix never wins). Empty = direct exposure,
    # proxy headers are ignored. Proxies may append or overwrite the
    # header; both work, appending only risks an extra unused prefix.
    trusted_proxies: []

# Meshtastic Companion link (optional): the Heltec node plugs in over USB
# and exposes the mesh as a source plus the group/direct announcement
# actions. The announcement switches below are the STARTUP state; the
# admin Config page toggles the same switches at runtime and writes them
# back to this file.
meshtastic:
  enabled: false
  device: ""

  # Hazard announcements on the group channel and as direct messages to
  # users' registered node IDs (both ON by default).
  channel_alerts: true
  dm_alerts: true

  # APRS stations entering/leaving the operational range announced on
  # the group channel — useful but noisy, OFF by default.
  station_alerts: false

# GSM cellular modem (optional): a serial AT modem (e.g. Huawei E173 on
# /dev/ttyUSB0) receives and sends SMS. Received messages land in the
# durable history and later feed the SMS command interpreter; the admin
# GSM page shows the history and sends messages to phone numbers.
gsm:
  enabled: false
  # Serial device of the modem's AT port.
  device: ""

# ActionPlugins: explicitly invoked by the group routing rule engine
# (Groups page in the web UI). They never automatically receive MQTT
# events. Built-in types: smtp (email), http_webhook, discord, aprs,
# aprs-out, sms.
actions:

  # SMTP email action: sends one plain-text email per routed dispatch
  # event. Requires host, from and at least one recipient. Two TLS modes:
  # STARTTLS (port 587, default) or implicit TLS/SMTPS (port 465, set
  # implicit_tls: true). AUTH PLAIN is used when username is set. The
  # password comes from password OR password_file (Docker secrets), never
  # both. ca_file appends a PEM CA bundle for private servers with their
  # own certificate authority.
  # - id: smtp-alerts
  #   type: smtp
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 5m
  #     shutdown_timeout: 10s
  #     # Extra delivery attempts after the first failure (fixed 5s
  #     # backoff). Every attempt lands in the /notifications audit
  #     # trail. 0 = deliver once, no retry.
  #     retries: 2
  #
  #   config:
  #     host: smtp.example.com
  #     port: 587
  #     from: warnflux@example.com
  #     to: ["ops@example.com"]
  #     username: ""
  #     password: ""
  #     password_file: ""
  #     implicit_tls: false
  #     starttls: true
  #     ca_file: ""
  #     # The subject bracket comes from web.header1 (e.g. "[SPOK]");
  #     # subject_prefix is only a fallback when the application identity
  #     # is not populated. The mail body is HTML (human-first summary,
  #     # technical table) with a plain-text alternative and a branded
  #     # footer (version, domain, repository link).
  #     subject_prefix: "[WarnFlux]"
  #     # Emails per minute, evenly spaced (0 = default 30, negative =
  #     # unlimited). Group members receive Bcc copies: one SMTP
  #     # transaction per unique address.
  #     rate_limit_per_minute: 20
  #
  # APRS message action: sends one APRS text message per routed dispatch
  # event to the listed ham callsigns, through the shared APRS hub (the
  # first ready transmitter: aprs-inet today, aprs-radio later). Messages
  # are single APRS lines (max 67 characters): "<prefix> <SEVERITY>
  # <event> <headline>". Requires aprs.enabled: true.
  # - id: aprs-hams
  #   type: aprs
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 15s
  #     shutdown_timeout: 10s
  #
  #   config:
  #     callsigns: ["SP9XYZ-7", "SR9KR"]
  #     # Prefix of every message; empty = web.header1.
  #     prefix: ""

  # APRS-out action: sends APRS text messages to the listed ham callsigns
  # (plus the matched group's members' registered callsigns) and WAITS for
  # each addressee's ack when possible. Delivery is paced — a per-station
  # cooldown and a global tx interval keep the action from spamming the
  # shared channel — and unacknowledged messages fail the call so the
  # manager retries them, exactly like SMTP. Requires aprs.enabled: true
  # and a connected transmitter (aprs-inet or aprs-radio).
  # - id: aprs-hams-rf
  #   type: aprs-out
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     # Must comfortably exceed config.ack_timeout.
  #     call_timeout: 5m
  #     shutdown_timeout: 10s
  #     retries: 2
  #
  #   config:
  #     callsigns: ["SP9XYZ-7", "SR9KR"]
  #     # Prefix of every message; empty = web.header1.
  #     prefix: ""
  #     # Minimum interval between two messages to the SAME station;
  #     # negative disables the cooldown.
  #     cooldown: 2m
  #     # How long one message waits for the addressee's ack before the
  #     # call fails (used only when require_ack is true).
  #     ack_timeout: 45s
  #     # Wait for acks? false = the call succeeds once the frame is
  #     # transmitted (listeners on plain radios cannot ack); acks are
  #     # still recorded when they arrive.
  #     require_ack: false
  #     # Minimum spacing between any two transmissions of this action;
  #     # negative disables it.
  #     tx_interval: 5s
  #
  # Generic HTTP webhook action: one JSON POST per routed notification.
  # Covers Discord, Slack-compatible gateways, ntfy, Gotify bridges,
  # Home Assistant and SMS gateways — anything accepting a webhook POST.
  # - id: wh-discord
  #   type: http_webhook
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 15s
  #     shutdown_timeout: 10s
  #     # Transient failures (5xx, timeouts) are retried by the action
  #     # machinery with a fixed 5s backoff; every attempt lands in the
  #     # /notifications audit trail.
  #     retries: 2
  #
  #   config:
  #     url: https://discord.com/api/webhooks/1234/secret
  #     # Optional extra headers (provider-specific fields).
  #     headers: {}
  #     # Bearer secret from token OR token_file (Docker secrets),
  #     # never both. Sent as "Authorization: Bearer <token>".
  #     token: ""
  #     token_file: ""
  #     # Per-request timeout; 0 = default (10s). The instance
  #     # call_timeout still caps the whole call.
  #     timeout: 10s
  #
  # Discord action: routed notifications on a channel AND, with a bot
  # token, the same notifications plus the station's services as PRIVATE
  # messages to the operators registered in the directory.
  #
  # WHAT IT GIVES YOU
  # - Channel alerts: one human-readable message per routed notification
  #   (severity first, then event, headline and areas, truncated to
  #   Discord's 2000-character content limit) on the webhook's channel.
  # - Private alerts (token): the same notification as a direct message
  #   to every routed recipient's own Discord id.
  # - Commands (token): an operator writes the SAME slash commands the
  #   radio channels take (/help, /hazard, /ping, /weather, and /alert,
  #   /emcom) in a private message to the bot and the station answers
  #   there. Two rules keep the surface closed: channel posts never reach
  #   the interpreter (no command is ever answered on a channel), and only
  #   a KNOWN sender is answered at all — one whose profile carries their
  #   Discord id. Anybody else is dropped in silence, so a stranger on the
  #   same server cannot list the commands or read the station's answers.
  # - Periodic notices (on the channel, never privately): a hazard status
  #   line ("WarnFlux: 1 severe or more, 5 other active — https://your.site
  #   · DM me /hazard for the list") and a presence line (installation
  #   identity + uptime), the Discord counterpart of the Meshtastic
  #   group-channel rhythm — same cadence, same wording, same rules. The
  #   status line goes out ONLY while something sits at severe or higher
  #   (the level that already rang the devices): an hourly "0 severe" line
  #   would train the readers to ignore the one that matters. The presence
  #   line is anchored to a DAILY clock time (06:00 station local time by
  #   default, like the Meshtastic beacon), never to a restart. The channel
  #   is the station's shared surface, while a private message stays
  #   reserved for what concerns that one operator (their alerts, the mass
  #   notices and their own command answers). The notices need no token.
  # - Mass info (token): the admin panel's broadcast delivers a direct
  #   message per recipient. It NEVER falls back to a channel post.
  #
  # SETUP, STEP BY STEP
  # 1. https://discord.com/developers/applications -> New Application,
  #    name it after the station.
  # 2. Bot tab -> Add Bot -> "Reset Token" and copy it into `token:`
  #    below (treat it like a password: it never belongs in a repository
  #    — this file is deployment-local). The same page shows the bot
  #    name and the application id.
  # 3. Still on the Bot tab -> Privileged Gateway Intents -> switch on
  #    MESSAGE CONTENT INTENT. Without it Discord delivers the TEXT of
  #    every direct message as an empty string, so commands cannot work:
  #    the station notices that, logs what to enable and keeps waiting —
  #    switching it on later needs no restart. (A bot in fewer than 100
  #    servers may enable it without verification.)
  # 4. Invite the bot: OAuth2 -> URL Generator -> scope `bot`, permissions
  #    `Send Messages` + `Read Message History`, open the generated URL
  #    and pick the server. A bot can only send a direct message to
  #    somebody who shares a server with it, so the operators must be on
  #    that server.
  # 5. Channel alerts: in the target channel -> Integrations -> Webhooks
  #    -> New Webhook -> copy the URL into `url:` below. That channel is
  #    the station's public surface; the webhook needs no bot and no
  #    token.
  # 6. Let the operators register their ids: Discord -> User Settings ->
  #    Advanced -> Developer Mode on, then right-click your own name ->
  #    Copy User ID (a ~19-digit number). The station's /account page
  #    takes it in the profile's Discord field — that is where the
  #    private messages go, and what makes the sender KNOWN: without it
  #    the station answers nothing in a DM, with it the public commands
  #    run and the restricted ones (/alert, /emcom) follow the same group
  #    rules as the radio. A username ("name#1234") can NEVER authorize a
  #    sender, so the field must hold the numeric id.
  #
  # - id: discord-alerts
  #   type: discord
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 15s
  #     shutdown_timeout: 10s
  #     retries: 2
  #
  #   config:
  #     # Webhook of the channel that carries the routed alerts. Required:
  #     # it is the one surface that works without a bot.
  #     url: https://discord.com/api/webhooks/1234/secret
  #     # Optional bot display name override (defaults to the webhook's
  #     # own name).
  #     username: "WarnFlux"
  #     # Public invite to the station's server (Discord -> Invite People ->
  #     # Edit invite link). Optional, but it is what the Help page shows so
  #     # users join with one click instead of hunting for the link.
  #     invite: "https://discord.gg/abcdefg"
  #     # BOT TOKEN from the Developer Portal (Bot tab). Optional, but it
  #     # is what turns the surfaces above on: private alerts, mass
  #     # delivery, command answers and the direct-message copies of the
  #     # periodic notices. Leave it empty and Discord stays channel-only.
  #     # Treat it like a password: keep it out of repositories (this file
  #     # is deployment-local) and restrict who can read it.
  #     token: ""
  #     # The three cadence knobs below are also editable on the Config
  #     # page ("Periodic lines"), which writes them here and on the
  #     # Meshtastic beacon at once so both channels announce in step.
  #     # Spacing of the hazard status line, posted on the webhook channel
  #     # ONLY while a hazard at severe or higher is active. Empty = 1h, the
  #     # same cadence (and the same rule) as the Meshtastic channel; 0
  #     # disables it.
  #     hazards_interval: 1h
  #     # Daily clock time of the presence line (installation identity +
  #     # uptime), the station's local time — the Discord counterpart of the
  #     # Meshtastic beacon, anchored the same way. Default "06:00"; an
  #     # explicit "" falls back to uptime_interval below.
  #     uptime_at: "06:00"
  #     # SPACING alternative to the anchor (1m..720h): the line then fires
  #     # every interval from the start. Naming it together with a non-empty
  #     # uptime_at is a configuration error; "" plus 0 disables the line.
  #     # uptime_interval: 24h
  #     # Per-request timeout; 0 = default (10s).
  #     timeout: 10s
  #
  # Note: a direct-message copy is only ever sent to a numeric user id; a
  # profile carrying a username fails for that recipient (the panel shows
  # it as a failure). Wrong-token or no-shared-server answers from the
  # API land in the log with Discord's own reason.
  #
  # Meshtastic action: SOSNA alerts as direct messages to the routed
  # group members' registered node IDs, plus a broadcast on the
  # configured group channel — the channel broadcast is the base
  # delivery and goes out even when no member registered a node ID
  # (it reaches listeners without accounts). The hub tracks each
  # transmission's delivery state (sent/delivered/failed) in the
  # durable history.
  # - id: meshtastic-alerts
  #   type: meshtastic
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 30s
  #     shutdown_timeout: 10s
  #     retries: 1
  #
  #   config:
  #     prefix: "SOSNA"
  #     tx_interval: 5s
  #     timeout: 10s
  #     channel: 1   # group channel (1-7) every alert is published on;
  #                  # 0 = off (direct messages only, never PRIMARY)

  # SMS action: sends one text message per routed notification through the
  # shared GSM hub (the serial AT session to the cellular modem) — a fully
  # local channel, like APRS radio and Meshtastic. Recipients are the
  # numbers below plus the matched group's members' registered phone
  # numbers (de-duplicated by digits, each in their notification
  # language); config.phones may be empty when every recipient is in the
  # directory. Each message is transliterated and capped at the
  # single-segment SMS limit. Requires gsm.enabled: true with a working
  # modem — configuring this action as enabled WITHOUT the GSM hub stops
  # the daemon from starting (the action cannot be constructed).
  # - id: sms-alerts
  #   type: sms
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 1m
  #     shutdown_timeout: 10s
  #     retries: 1
  #
  #   config:
  #     prefix: "SOSNA"
  #     phones: ["+48509558155"]  # optional; 32 numbers at most

# Public HTTP ingest endpoints: POST /api/v1/ingest/<id>, protected by an
# API key. Accepts hazard messages in two shapes:
#   1. the canonical WarnFlux MQTT /events wire payload (as published on
#      <prefix>/events), or
#   2. a simplified builder form:
#        {"severity":"severe","headline":"...","event":"Pożar",
#         "urgency":"immediate","certainty":"observed","areas":["..."],
#         "description":"...","source_id":"..."}
# Accepted messages are dispatched into the LOCAL pipeline first (durable
# inbox — the endpoint never depends on the broker connection) and their
# broker publication is persisted into the durable outbox BEFORE the 202:
# a background worker publishes them to <topic_prefix>/events whenever the
# broker is connected (publish mask applied at publish time), with
# at-least-once semantics. A broker outage therefore never rejects an
# accepted request nor loses its cross-instance sync. The regular
# receiver -> routing matrix -> actions flow then handles them like any
# upstream WarnFlux message. The instance id is the event source stamped
# on builder-mode alerts (it shows up as a matrix source row in the
# Groups page).
ingest_http:

  - id: news
    enabled: false

    # API key from api_key OR api_key_file (Docker secrets), never both.
    # At least 16 characters; presented as "Authorization: Bearer <key>".
    api_key: "changeme-secret-key-000000"
    api_key_file: ""

    # Key rotation: previous_key is accepted alongside api_key until it
    # is removed from the configuration (scrapers can be migrated to the
    # new key first). Same file alternative: previous_key_file.
    previous_key: ""
    previous_key_file: ""

    # Optional source allowlist: CIDR blocks or single IPs. Empty = any
    # source address. Requests from other addresses get 403.
    allowed_cidrs: []

    # Requests per minute per endpoint (token bucket, one minute burst).
    # 0 = default (60); negative = unlimited. 429 carries a Retry-After.
    rate_limit_per_minute: 0

    # Broker settings are OPTIONAL: when empty, the endpoint inherits the
    # broker, credentials and topic prefix of the primary MQTT output
    # (the first enabled output with type: mqtt) — all plugins push to
    # the one main broker. Fill them in only to override per instance.
    broker: ""
    client_id: ""          # defaults to warnflux-ingest-news
    username: ""
    password: ""
    password_file: ""
    topic_prefix: ""       # defaults to the mqtt output's prefix

# APRS hub: the shared merge point for every APRS backend (aprs-inet now,
# aprs-radio later). It maintains ONE retained station-state document per
# nearby station on MQTT (<topic_prefix>/aprs/stations/<CALLSIGN>), the
# non-retained packet feed (aprs/packets) and the rx/tx message feed
# (aprs/messages). APRS plugins require aprs.enabled.
aprs:
  enabled: false

  # Our identity: the callsign (with optional -SSID) messages are
  # addressed to and transmitted from.
  callsign: "SP9MOA-10"

  # Optional display name of our station (e.g. "SOSNA Niepołomice"); it
  # rides along in routed APRS messages. Defaults to the callsign.
  name: ""

  # Our APRS icon: one symbol code (e.g. "j") or table+code (e.g. "/j").
  icon: "/j"

  # Our position as a Maidenhead locator (2, 4, 6 or 8 characters). The
  # station identity (self document, own beacon) uses its center.
  gridsquare: "JO90WW"

  # Optional exact position of our station (e.g. the antenna's real
  # coordinates from direwolf.conf). When both are set they override the
  # gridsquare center. When unset, WarnFlux learns the position from our
  # own position beacon (Direwolf PBEACON) and the home-map locator
  # shows it where it actually is.
  # latitude: 50.0212
  # longitude: 20.2075

  # "Nearby" radius in kilometers: the fallback for the operational-area
  # radius when area_radius_km is unset. Editable on the Config page
  # ("Polling and range"); 1..1000.
  radius_km: 60

  # Operational area (the territory we serve): the home-map range circle,
  # the compose map picker, the APRS-IS collection filter and the
  # geo-scoped sources (gddkia, gios, adsb) center on this point and use
  # this radius. Empty center = the station position; area_radius_km: 0
  # = radius_km. The station itself (self document, locator dot) always
  # stays at latitude/longitude.
  # area_latitude: 50.0562
  # area_longitude: 20.0610
  # area_radius_km: 0

  # How long a station stays in the retained MQTT state after its last
  # packet before the topic is deleted (empty retained payload). Longer
  # values keep rarely-beaconing stations visible on the map. Editable on
  # the Config page ("Polling and range"); 1m..24h.
  station_ttl: 60m

  # How long a heard APRS bulletin (BLNn broadcast) stays in the
  # retained MQTT state under aprs/bulletins/* before the topic is
  # deleted. 1m-24h; default 24h.
  # bulletin_ttl: 24h

  # Drop APRS infrastructure from the station state: objects/items,
  # digipeaters, igates/gateways, internet-only nodes and repeaters.
  # The neighbourhood map then shows actual ham stations only.
  exclude_infrastructure: true

  # APRS messages addressed to us are answered in-band exactly like the
  # Meshtastic hub: a plain message answers with the installation
  # banner, /help lists the commands, and /alert (allow-listed senders
  # only) raises a severe alert in the normal dispatch path. The Help
  # page lists the whole command set. Only senders whose BASE callsign
  # (SSID-insensitive) is registered on one of the directory users may
  # run commands. Only messages heard by OUR radio (the KISS backend)
  # react: APRS-IS-delivered copies are recorded and displayed, never
  # answered — an internet-injected message can't raise an alarm.
  # route_messages: false

# Meshtastic Companion serial link (Heltec V4 over USB). When enabled,
# WarnFlux speaks the Companion protocol: adverts populate the admin
# /meshtastic "heard nodes" tab, channel/contact messages land in the
# durable history, and the "meshtastic" action pushes SOSNA alerts onto
# the mesh.
# meshtastic:
#   enabled: true
#   device: /dev/ttyACM0   # the node plugs in over USB serial; a
#                          # comma-separated list is tried in order, so
#                          # a node that re-enumerates after a USB reset
#                          # (ttyACM0 <-> ttyACM1) is found regardless
#                          # of the port number it landed on
#   baud: 115200
#   # How to reach the node: "serial" (USB CDC, the default) or "tcp"
#   # (the node's WiFi API). With "tcp" the device field is ignored.
#   transport: serial
#   host: 192.168.1.40     # transport "tcp" only: the node's address
#                          # (host, IP or host:port; the Meshtastic API
#                          # port 4403 is appended when missing)
#   route_messages: false  # direct messages from directory-registered
#                         # node IDs become canonical /events documents
#                         # (alarm pipeline), like APRS messages
#   node_ttl: 30m
#   # Editable on the Config page ("Polling and range"); 1m..24h.
#   # Periodic presence beacon (identity + uptime + node count) on a
#   # community channel. The default PRIMARY channel is receive-only:
#   # broadcasts there are blocked by policy. Give every installation
#   # that ingests the same sources its OWN channel: two stations
#   # beaconing (and alerting) on one channel duplicate every message on
#   # the shared air. This channel is also the one the Help page hands to
#   # users (name + key + scan code), so point it at the group channel
#   # people should join.
#   emcom_channel: 1      # 0 = beacon disabled
#   # The beacon cadence and emcom_hazards_interval below are also
#   # editable live on the Config page ("Periodic lines"), together with
#   # the Discord channel cadence — one form keeps both surfaces in step.
#   # Presence beacon: the installation identity with the node count and
#   # the station uptime ("WarnFlux v0.7.6 - SOSNA - sosna.sp9moa.pl |
#   # up 2d4h | nodes 12"). It is ANCHORED TO A DAILY CLOCK TIME by
#   # default, 06:00 station local time — a restart never beacons ahead
#   # of the schedule. Name emcom_at to move it, or emcom_interval for a
#   # plain spacing instead (the first beacon then fires at startup);
#   # naming both is a configuration error, and an empty emcom_at with a
#   # zero emcom_interval turns the beacon off.
#   emcom_at: "06:00"     # default
#   # emcom_interval: 4h  # alternative to emcom_at (1m..720h)
#   # Periodic hazard status line on the same emcom channel: ONE short
#   # message with the counters ("1 severe or more, 12 other active")
#   # and the public site holding the details, plus the "DM me /hazard
#   # for the list" hint the Discord status line carries too. It never
#   # lists the hazards: severe ones already went out as their own
#   # alerts, and a list would repeat them on the air. Sent only while a
#   # hazard at severe or higher is active, so a quiet channel stays
#   # quiet instead of reading "0 severe" every hour.
#   emcom_hazards_interval: 1h  # default; 0 = status line disabled
#                              # the line goes out only while a hazard at
#                              # severe or higher is active (same rule as
#                              # the Discord status line)
#   # Read-only tab channel: received traffic on this channel index gets
