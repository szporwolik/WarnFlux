{{define "traffic"}}<section class="card log-card page-panel" id="panel-traffic" data-panel="panel-traffic"{{if ne .Tab "traffic"}} hidden{{end}}>
  <div class="page-tabs" role="tablist">
    <button type="button" class="page-tab active" role="tab" aria-selected="true" data-tab="traffic-view">
      <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-diagram-3"></use></svg>{{tr .Lang "traffic.tab.traffic"}}
    </button>
    <button type="button" class="page-tab" role="tab" aria-selected="false" data-tab="traffic-browser">
      <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-list"></use></svg>{{tr .Lang "traffic.tab.browser"}}
    </button>
  </div>
  <section class="page-panel" id="traffic-view" data-panel="traffic-view">
    <h2><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-diagram-3"></use></svg>{{tr .Lang "traffic.title"}}</h2>
    <p class="muted log-hint">{{trf .Lang "traffic.hint" .MaxEntries}}</p>
    <div id="traffic-viewer" class="log-viewer traffic-viewer" data-after="0"></div>
  </section>
  <section class="page-panel" id="traffic-browser" data-panel="traffic-browser" hidden>
    <h2><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-list"></use></svg>{{tr .Lang "traffic.browser"}}</h2>
    <p class="muted log-hint">{{tr .Lang "traffic.browser.hint"}}</p>
    <form id="browse-form" class="browse-form">
      <label class="browse-field">{{tr .Lang "dash.receiver"}}
        <select id="browse-receiver">
          {{range .Receivers}}<option value="{{.ID}}">{{if .Connected}}● {{end}}{{.Label}}</option>{{end}}
        </select>
      </label>
      <label class="browse-field">{{tr .Lang "traffic.topic"}}
        <input id="browse-topic" class="mono" value="#" autocomplete="off" spellcheck="false">
      </label>
      <label class="browse-field">{{tr .Lang "traffic.window"}}
        <select id="browse-window">
          <option value="1">1 s</option>
          <option value="2" selected>2 s</option>
          <option value="3">3 s</option>
          <option value="5">5 s</option>
          <option value="10">10 s</option>
        </select>
      </label>
      <button type="submit" class="btn-primary">{{tr .Lang "traffic.browse"}}</button>
    </form>
    <div id="browse-status" class="browse-status" hidden></div>
    <div id="browse-results" class="table-wrap" hidden>
      <table class="browse-table">
        <thead>
          <tr><th>{{tr .Lang "traffic.topic"}}</th><th>QoS</th><th>{{tr .Lang "traffic.retained"}}</th><th>{{tr .Lang "traffic.size"}}</th><th>{{tr .Lang "traffic.payload"}}</th></tr>
        </thead>
        <tbody id="browse-rows"></tbody>
      </table>
    </div>
  </section>
</section>
{{end}}
