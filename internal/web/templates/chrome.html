{{define "sidebar"}}  <aside class="sidebar">
    <a class="brand" href="/dashboard">
      <img class="brand-logo" src="/static/assets/logo.png" alt="" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-name">{{.Header1}}</span>
        {{if .Header2}}<span class="brand-sub">{{.Header2}}</span>{{end}}
      </span>
    </a>
    <nav class="sidenav">
      <a class="nav-item{{if .NavDashboard}} active{{end}}" href="/dashboard"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-house"></use></svg><span class="nav-label">Dashboard</span></a>
      <a class="nav-item{{if .NavUsers}} active{{end}}" href="/users"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-person"></use></svg><span class="nav-label">Users</span></a>
    </nav>
    <span class="sidebar-spacer"></span>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="btn-ghost"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-box-arrow-right"></use></svg><span class="nav-label">Sign out</span></button>
    </form>
  </aside>
{{end}}

{{define "footer"}}  <footer class="footer">
    <span class="footer-meta">
      <span class="footer-name">{{.AppTitle}}</span>
      <span class="sep">·</span>
      <span>{{.Version}}</span>
      <span class="sep">·</span>
      {{if ne .Commit "unknown"}}<a class="commit-link" href="https://github.com/szporwolik/WarnFlux/commit/{{.Commit}}" target="_blank" rel="noopener noreferrer">{{.Commit}}</a>{{else}}{{.Commit}}{{end}}
    </span>
    <a class="gh-link" href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer" aria-label="Open the WarnFlux repository on GitHub"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-github"></use></svg></a>
  </footer>
{{end}}
