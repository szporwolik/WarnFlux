name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, test, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify the commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::refusing to release: ${{ github.ref }} is not on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Derive version (tag or VERSION file) and cross-check
        id: version
        run: |
          version=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            # The VERSION file at the repository root is the canonical source
            # of truth: the tag must match it, so releases can never publish
            # a version that was not bumped intentionally.
            file_version="$(tr -d '[:space:]' < VERSION)"
            if [ "$file_version" != "$version" ]; then
              echo "::error::tag $tag != VERSION file '$file_version' (update the VERSION file at the repo root first)"
              exit 1
            fi
          else
            # Manual run: the version is the VERSION file, as-is.
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$version' is not a semantic version like 0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: go vet ./... && go test -count=1 ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # Must mirror the `toolchain` directive in go.mod so the release
          # gate scans the same toolchain the build uses.
          go-version-input: '1.26.6'
          go-package: ./...

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/warnflux
          # Note: docker/metadata-action's semver {{version}} strips the
          # leading 'v'; the explicit v-prefix in the pattern keeps it.
          # No floating major tag before 1.0: 'v0' would silently cross
          # breaking minor releases. The semver type adds the 'latest'
          # tag automatically for the newest stable version.
          tags: |
            type=semver,pattern=v{{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm/v7 covers 32-bit Raspberry Pi OS; arm64 covers modern
          # 64-bit Pi OS and ARM servers.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          # GitHub Actions cache speeds up repeat builds (the arm64 leg
          # runs under QEMU and dominates release time).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ github.sha }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-linux-amd64 ./cmd/warnflux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-linux-arm64 ./cmd/warnflux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-linux-armv7 ./cmd/warnflux

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh CLI (no Node runtime) creates the release; when the run was
          # triggered manually (workflow_dispatch) it also creates the
          # missing v<version> tag pointing at this commit.
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/warnflux-linux-amd64 \
            dist/warnflux-linux-arm64 \
            dist/warnflux-linux-armv7 \
            dist/SHA256SUMS \
            --title "WarnFlux v${{ steps.version.outputs.version }}" \
            --generate-notes

