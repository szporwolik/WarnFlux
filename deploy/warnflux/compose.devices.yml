# Device overlay for the WarnFlux stack.
#
# Kept OUT of compose.yml on purpose: `devices:` is resolved when the container
# is created, so listing a path that does not exist yet makes Docker refuse to
# create the container at all (exit 255, no retry). The base compose.yml starts
# without any device; this overlay is added only when the GSM modem is present
# (see deploy/warnflux-stack-up.sh and the reconcile timer).
services:
  warnflux:
    # by-id, never a bare ttyUSB number: the numbering moves when USB
    # re-enumerates (it already swapped for the GPS and the AIOC on the same
    # host), and a number would silently hand the station the wrong device.
    # gsm.device in the configuration must point at /dev/modem accordingly.
    devices:
      - /dev/serial/by-id/usb-HUAWEI_Technology_HUAWEI_Mobile-if00-port0:/dev/modem
    group_add:
      - "20"   # dialout: rw on the modem device
