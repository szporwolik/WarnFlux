{{define "audit"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit log · {{.AppTitle}}</title>
  <link rel="stylesheet" href="/static/style.css?v={{.Commit}}">
  <link rel="icon" href="/static/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
</head>
<body class="app">
  {{template "topbar" .}}
  {{template "sidebar" .}}
  <main class="users-main">
    <section class="card log-card">
      <h2><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-check-circle"></use></svg>Audit log</h2>
      <p class="muted log-hint">User actions performed through the dashboard, persisted in the database (up to {{.MaxEntries}} entries). Refreshes automatically.</p>
      <div id="audit-viewer" class="log-viewer" data-after="0"></div>
    </section>
  </main>
  {{template "footer" .}}
  <script src="/static/app.js?v={{.Commit}}" defer></script>
</body>
</html>
{{end}}
