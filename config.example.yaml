# WarnFlux configuration example.
# Copy to config.yaml and adjust it for your environment.

app:
  # One of: debug, info, warn, error.
  log_level: info

  # Optional rotating log file; empty means log to stdout only.
  # In Docker, point this at the mounted volume, e.g. /logs/warnflux.log.
  log_file: ""

  # Rotate the log file once it grows beyond this size (megabytes).
  log_max_size_mb: 10

  # How many rotated log files to keep.
  log_max_backups: 5

  # How often to check for and mark expired events, e.g. 1m, 30s.
  expiration_interval: 1m

storage:
  # The only supported driver for now.
  driver: sqlite

  # Local development. When running in Docker, point this at the mounted
  # persistent volume, e.g. /data/warnflux.db.
  path: ./warnflux.db

mqtt:
  # Set to false to run WarnFlux without an MQTT connection.
  enabled: true

  # MQTT broker URL, e.g. tcp://localhost:1883 or ssl://broker.example.com:8883.
  broker: tcp://localhost:1883

  # Client identifier used with the broker.
  client_id: warnflux

  # Credentials; leave empty for anonymous access.
  username: ""
  password: ""

  # The ping is published to <topic_prefix>/status/ping.
  topic_prefix: warnflux

  # QoS for published messages: 0, 1 or 2.
  qos: 1

  # Interval between heartbeat messages, e.g. 30s, 1m.
  ping_interval: 30s
