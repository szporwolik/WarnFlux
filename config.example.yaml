# WarnFlux configuration example.
# Copy to config.yaml and adjust it for your environment.

app:
  # One of: debug, info, warn, error.
  log_level: info

  # Optional rotating log file; empty means log to stdout only.
  # In Docker, point this at the mounted volume, e.g. /logs/warnflux.log.
  log_file: ""

  # Rotate the log file once it grows beyond this size (megabytes).
  log_max_size_mb: 10

  # How many rotated log files to keep.
  log_max_backups: 5

  # How often to check for and mark expired events, e.g. 1m, 30s.
  expiration_interval: 1m

  # How long acknowledged journal records are kept before deletion,
  # e.g. 24h. Must be > 0.
  change_retention: 24h

  # How long cancelled/expired current-state records are kept in the
  # events table, e.g. 720h (30 days). Active events are never cleaned.
  event_retention: 720h

  # How long action-fire ledger rows are kept before pruning. They bound
  # the dedup window: a replayed event can fire again only after its row
  # expires. Negative = never prune (ledger grows forever).
  notification_retention: 720h

storage:
  # The only supported driver for now.
  driver: sqlite

  # Local development. If path is omitted entirely, WarnFlux warns and
  # creates warnflux.db next to the binary (dev/debug convenience).
  # In Docker, always set it explicitly, e.g. /data/warnflux.db.
  path: ./warnflux.db

# Source plugins: ingest hazard information and emit normalized events.
sources:
  # Open-Meteo INFORMATIONAL weather source: publishes ordinary weather
  # snapshots to retained MQTT information topics
  # (<topic_prefix>/info/openmeteo/<producer_id>/<location_id>/weather).
  # It does NOT generate HazardEvents. See
  # internal/plugins/sources/openmeteo/README.md and docs/weather-schema.md.
  - id: weather-home
    type: openmeteo
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 15m
      request_timeout: 10s

      forecast_hours: 48
      forecast_days: 7

      # Free Open-Meteo API:
      api_key: ""
      api_key_file: ""

      locations:
        - id: home
          name: Home
          latitude: 50.0000
          longitude: 20.0000

  # IMGW-PIB public warnings: a real HAZARD source consuming the official
  # warningsmeteo and warningshydro feeds with full-snapshot disappearance
  # reconciliation (see internal/plugins/sources/imgw/README.md).
  # Data source: Instytut Meteorologii i Gospodarki Wodnej – Państwowy
  # Instytut Badawczy (IMGW-PIB); https://danepubliczne.imgw.pl/apiinfo.
  - id: imgw-warnings
    type: imgw
    enabled: true

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the data API base (testing/custom deployments).
      # base_url: https://danepubliczne.imgw.pl/api/data

      # Feeds to consume: meteo, hydro, or both. Omitted → both.
      feeds:
        - meteo
        - hydro

      # Optional geographic filtering: only warnings whose TERYT areas
      # intersect the configured target units are emitted (hierarchical
      # matching). Filtered warnings never make the provider snapshot
      # incomplete; a warning whose areas stop intersecting the target is
      # reconciled/cancelled by the next complete snapshot. Unknown
      # configured names fail startup.
      geography:
        enabled: true
        include:
          - gmina:niepolomice
          - miasto:krakow
          - powiat:wielicki
          - powiat:bochenski

  # Regionalny System Ostrzegania (RSO) public XML communications:
  # a HAZARD source with upstream voivodeship filtering via the official
  # endpoint (see internal/plugins/sources/rso/README.md).
  # Source: RSO / TVP, https://www.komunikaty.tvp.pl/Info/Integration.
  - id: rso-malopolskie
    type: rso
    enabled: true

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the portal base (testing/custom deployments).
      # base_url: https://komunikaty.tvp.pl

      # One or more official RSO voivodeship slugs; omitted → [wszystkie].
      # "wszystkie" is exclusive (cannot be combined with regional slugs).
      voivodeships:
        - malopolskie

      # Optional high-signal policy: suppress RCB and air-quality
      # communications, collapse plain IMGW duplicates, classify severity
      # from explicit wording (never from rso_alarm) and apply the
      # Niepołomice-area / A4 Balice–Tarnów geographic thresholds.
      # Filtered items never make the provider snapshot incomplete.
      filter:
        high_signal_only: true
        exclude_rcb: true
        exclude_air_quality: true
        suppress_imgw_duplicates: true
        local_min_severity: moderate
        regional_min_severity: severe
        a4_corridor:
          enabled: true
          km_from: 400
          km_to: 503

  # APRS-IS source: connects to an APRS-IS server, subscribes to packets
  # around the configured position (aprs.gridsquare + aprs.radius_km) and
  # feeds them into the shared APRS hub, which publishes the merged
  # station state, the packet feed and messages addressed to our callsign
  # on MQTT. Requires aprs.enabled: true.
  #
  # The plugin also TRANSMITS: the aprs action below (and future rule
  # wiring) sends APRS text messages to hams through this connection.
  # See internal/plugins/sources/aprsinet/README.md.
  #
  # - id: aprs-inet-main
  #   type: aprs-inet
  #   enabled: false
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     # Login callsign. Defaults to aprs.callsign; must be validated
  #     # with the passcode on the APRS-IS server.
  #     callsign: "SP9MOA-10"
  #
  #     # APRS-IS validation code: passcode OR passcode_file.
  #     passcode: "12345"
  #     passcode_file: ""
  #
  #     # APRS-IS server (host:port). Tier-2 rotate default.
  #     server: "rotate.aprs2.net:14580"
  #
  #     # Optional filter override; the default is the automatic range
  #     # filter r/<lat>/<lon>/<radius_km> built from the aprs section.
  #     filter: ""
  #
  #     connect_timeout: 15s
  #     read_timeout: 10m

  # KISS radio backend: connects to a KISS TNC server over plain TCP
  # (Direwolf, aprsd, a hardware TNC bridge...) and feeds every decoded
  # frame into the shared APRS hub; while connected it also acts as the
  # outbound transmitter for APRS messages. Requires aprs.enabled: true.
  # Both backends run in parallel and complement each other: RF-heard
  # packets enrich the APRS-IS view, and outbound messages prefer the
  # radio for radio-heard stations (falling back to APRS-IS when the TNC
  # is down or the station is internet-only).
  # See internal/plugins/sources/aprsradio/README.md.
  #
  # - id: aprs-radio-main
  #   type: aprs-radio
  #   enabled: false
  #
  #   runtime:
  #     restart: true
  #     shutdown_timeout: 10s
  #
  #   config:
  #     # KISS server address (host:port). Required.
  #     server: "127.0.0.1:8001"
  #
  #     # Digipeater path used for outbound frames.
  #     path: ["WIDE1-1"]
  #
  #     connect_timeout: 15s
  #     read_timeout: 10m
  #     max_frame_bytes: 2048

# Output plugins: receive meaningful event changes from the core.
outputs:
  # Publishes hazard event changes and an application status snapshot to
  # MQTT. This is the only built-in output.
  - id: mqtt-main
    type: mqtt
    enabled: false

    runtime:
      timeout: 10s
      failure_threshold: 5

    config:
      # Broker URL, e.g. tcp://localhost:1883 or ssl://broker.example.com:8883.
      broker: tcp://localhost:1883
      # Required: every WarnFlux instance needs its own client ID
      # (two instances sharing one will kick each other off the broker).
      client_id: warnflux-home
      username: ""
      # Plaintext password, mutually exclusive with password_file.
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""
      # Event changes are published to <topic_prefix>/events; the status
      # snapshot (retained) goes to <topic_prefix>/status.
      topic_prefix: warnflux
      # QoS for event messages: 1 or 2. QoS 0 is rejected because it would
      # downgrade hazard delivery to best effort.
      qos: 1
      # Interval between retained status snapshots, e.g. 30s. Set to 0 to
      # disable periodic status publication.
      heartbeat_interval: 30s

# Dispatch subsystem: one canonical bounded ingress plus independent MQTT
# receiver clients (INPUT). The receiver clients are deliberately separate
# from outputs[].type=mqtt (the Router publisher): the publisher delivers
# Router state/events to a broker, receivers consume MQTT frames for
# dispatch. They MAY connect to the same broker but MUST use different
# client IDs.
dispatch:
  # Bounded canonical dispatch intake queue; a full queue drops events
  # (counted and logged) until the durable rule engine exists.
  queue_size: 1024

  mqtt_receivers:

    # Local receiver: consumes the local WarnFlux MQTT contract and
    # arbitrary local topics through the same canonical ingress.
    - id: local
      enabled: true

      broker: tcp://mosquitto:1883
      client_id: warnflux-dispatch-local

      username: ""
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""

      connect_timeout: 10s
      keep_alive: 30s

      # WarnFlux protocol mode: automatically subscribes
      # <prefix>/events, <prefix>/active/#, <prefix>/info/#, <prefix>/status
      # and parses them with the strict wire protocol.
      warnflux:
        enabled: true
        topic_prefix: warnflux

      # Generic MQTT subscriptions (standard MQTT wildcard semantics).
      subscriptions:
        - topic: "home/#"
          qos: 1

# Authenticated admin web UI (server-rendered, embedded assets, no CDN).
web:
  enabled: true
  listen: ":8080"
  # The web UI includes a built-in /test page: any logged-in user can
  # emit a synthetic hazard transition (severity/urgency/certainty) into
  # the dispatch ingress to exercise the group routing paths.

  # Application name: browser title and footer.
  title: "SOSNA"

  # System name shown next to the logo on the login page and in the
  # sidebar header. Defaults to the title.
  name: "SOSNA"

  # Branding shown next to the logo (sidebar) and on the login page.
  # header1 defaults to the name; header2 is an optional subtitle.
  header1: "SOSNA"
  header2: "Społeczny Otwarty System Notyfikacji i Alertów"

  # Optional one-line motto rendered in the footer on every page.
  tagline: "od społeczności • dla mieszkańców • w trosce o bezpieczeństwo"

  # Optional longer text shown on the public home page above the active
  # hazard list — a short intro about the system and its scope of
  # operation. Line breaks are preserved; limited HTML is allowed
  # (links). Leave empty to hide.
  about: |
    Krótka informacja o systemie: czym jest, jaki jest zakres
    działania, skąd pochodzą komunikaty i jak je interpretować.
    Więcej: <a href="https://sp9moa.pl">sp9moa.pl</a>

  # Public domain this instance is served under (host, optional port).
  # Reserved for future absolute-link features; no scheme, no path.
  # Empty disables them.
  domain: "sosna.sp9moa.pl"

  auth:
    username: admin
    password: change-me
    # Alternatively, read the password from a file (e.g. a Docker secret).
    # Mutually exclusive with password.
    password_file: ""

    # Set to true when serving behind TLS (session cookie becomes Secure).
    secure_cookie: false

# ActionPlugins: explicitly invoked by the group routing rule engine
# (Groups page in the web UI). They never automatically receive MQTT
# events. Built-in types: smtp (email), http_webhook, aprs.
actions:

  # SMTP email action: sends one plain-text email per routed dispatch
  # event. Requires host, from and at least one recipient. Two TLS modes:
  # STARTTLS (port 587, default) or implicit TLS/SMTPS (port 465, set
  # implicit_tls: true). AUTH PLAIN is used when username is set. The
  # password comes from password OR password_file (Docker secrets), never
  # both. ca_file appends a PEM CA bundle for private servers with their
  # own certificate authority.
  # - id: smtp-alerts
  #   type: smtp
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 5m
  #     shutdown_timeout: 10s
  #     # Extra delivery attempts after the first failure (fixed 5s
  #     # backoff). Every attempt lands in the /notifications audit
  #     # trail. 0 = deliver once, no retry.
  #     retries: 2
  #
  #   config:
  #     host: smtp.example.com
  #     port: 587
  #     from: warnflux@example.com
  #     to: ["ops@example.com"]
  #     username: ""
  #     password: ""
  #     password_file: ""
  #     implicit_tls: false
  #     starttls: true
  #     ca_file: ""
  #     # The subject bracket comes from web.header1 (e.g. "[SPOK]");
  #     # subject_prefix is only a fallback when the application identity
  #     # is not populated. The mail body is HTML (human-first summary,
  #     # technical table) with a plain-text alternative and a branded
  #     # footer (version, domain, repository link).
  #     subject_prefix: "[WarnFlux]"
  #     # Emails per minute, evenly spaced (0 = default 30, negative =
  #     # unlimited). Group members receive Bcc copies: one SMTP
  #     # transaction per unique address.
  #     rate_limit_per_minute: 20
  #
  # APRS message action: sends one APRS text message per routed dispatch
  # event to the listed ham callsigns, through the shared APRS hub (the
  # first ready transmitter: aprs-inet today, aprs-radio later). Messages
  # are single APRS lines (max 67 characters): "<prefix> <SEVERITY>
  # <event> <headline>". Requires aprs.enabled: true.
  # - id: aprs-hams
  #   type: aprs
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 15s
  #     shutdown_timeout: 10s
  #
  #   config:
  #     callsigns: ["SP9XYZ-7", "SR9KR"]
  #     # Prefix of every message; defaults to web.header1.
  #     prefix: "WarnFlux"

  # APRS-out action: sends APRS text messages to the listed ham callsigns
  # (plus the matched group's members' registered callsigns) and WAITS for
  # each addressee's ack when possible. Delivery is paced — a per-station
  # cooldown and a global tx interval keep the action from spamming the
  # shared channel — and unacknowledged messages fail the call so the
  # manager retries them, exactly like SMTP. Requires aprs.enabled: true
  # and a connected transmitter (aprs-inet or aprs-radio).
  # - id: aprs-hams-rf
  #   type: aprs-out
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     # Must comfortably exceed config.ack_timeout.
  #     call_timeout: 5m
  #     shutdown_timeout: 10s
  #     retries: 2
  #
  #   config:
  #     callsigns: ["SP9XYZ-7", "SR9KR"]
  #     prefix: "WarnFlux"
  #     # Minimum interval between two messages to the SAME station;
  #     # negative disables the cooldown.
  #     cooldown: 2m
  #     # How long one message waits for the addressee's ack before the
  #     # call fails (used only when require_ack is true).
  #     ack_timeout: 45s
  #     # Wait for acks? false = the call succeeds once the frame is
  #     # transmitted (listeners on plain radios cannot ack); acks are
  #     # still recorded when they arrive.
  #     require_ack: false
  #     # Minimum spacing between any two transmissions of this action;
  #     # negative disables it.
  #     tx_interval: 5s
  #
  # Generic HTTP webhook action: one JSON POST per routed notification.
  # Covers Discord, Slack-compatible gateways, ntfy, Gotify bridges,
  # Home Assistant and SMS gateways — anything accepting a webhook POST.
  # - id: wh-discord
  #   type: http_webhook
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 15s
  #     shutdown_timeout: 10s
  #     # Transient failures (5xx, timeouts) are retried by the action
  #     # machinery with a fixed 5s backoff; every attempt lands in the
  #     # /notifications audit trail.
  #     retries: 2
  #
  #   config:
  #     url: https://discord.com/api/webhooks/1234/secret
  #     # Optional extra headers (provider-specific fields).
  #     headers: {}
  #     # Bearer secret from token OR token_file (Docker secrets),
  #     # never both. Sent as "Authorization: Bearer <token>".
  #     token: ""
  #     token_file: ""
  #     # Per-request timeout; 0 = default (10s). The instance
  #     # call_timeout still caps the whole call.
  #     timeout: 10s

# Public HTTP ingest endpoints: POST /api/v1/ingest/<id>, protected by an
# API key. Accepts hazard messages in two shapes:
#   1. the canonical WarnFlux MQTT /events wire payload (as published on
#      <prefix>/events), or
#   2. a simplified builder form:
#        {"severity":"severe","headline":"...","event":"Pożar",
#         "urgency":"immediate","certainty":"observed","areas":["..."],
#         "description":"...","source_id":"..."}
# Accepted messages are published to <topic_prefix>/events on the broker;
# the regular receiver -> routing matrix -> actions flow then handles them
# like any upstream WarnFlux message. The instance id is the event source
# stamped on builder-mode alerts (it shows up as a matrix source row in
# the Groups page).
ingest_http:

  - id: news
    enabled: false

    # API key from api_key OR api_key_file (Docker secrets), never both.
    # At least 16 characters; presented as "Authorization: Bearer <key>".
    api_key: "changeme-secret-key-000000"
    api_key_file: ""

    # Key rotation: previous_key is accepted alongside api_key until it
    # is removed from the configuration (scrapers can be migrated to the
    # new key first). Same file alternative: previous_key_file.
    previous_key: ""
    previous_key_file: ""

    # Optional source allowlist: CIDR blocks or single IPs. Empty = any
    # source address. Requests from other addresses get 403.
    allowed_cidrs: []

    # Requests per minute per endpoint (token bucket, one minute burst).
    # 0 = default (60); negative = unlimited. 429 carries a Retry-After.
    rate_limit_per_minute: 0

    # Broker settings are OPTIONAL: when empty, the endpoint inherits the
    # broker, credentials and topic prefix of the primary MQTT output
    # (the first enabled output with type: mqtt) — all plugins push to
    # the one main broker. Fill them in only to override per instance.
    broker: ""
    client_id: ""          # defaults to warnflux-ingest-news
    username: ""
    password: ""
    password_file: ""
    topic_prefix: ""       # defaults to the mqtt output's prefix

# APRS hub: the shared merge point for every APRS backend (aprs-inet now,
# aprs-radio later). It maintains ONE retained station-state document per
# nearby station on MQTT (<topic_prefix>/aprs/stations/<CALLSIGN>), the
# non-retained packet feed (aprs/packets) and the rx/tx message feed
# (aprs/messages). APRS plugins require aprs.enabled.
aprs:
  enabled: false

  # Our identity: the callsign (with optional -SSID) messages are
  # addressed to and transmitted from.
  callsign: "SP9MOA-10"

  # Our APRS icon: one symbol code (e.g. "j") or table+code (e.g. "/j").
  icon: "/j"

  # Our position as a Maidenhead locator (2, 4, 6 or 8 characters). The
  # aprs-inet filter and the nearby-station radius both use its center.
  gridsquare: "JO90WW"

  # "Nearby" radius around our position in kilometers.
  radius_km: 60

  # How long a station stays in the retained MQTT state after its last
  # packet before the topic is deleted (empty retained payload).
  station_ttl: 30m

  # Drop APRS infrastructure from the station state: objects/items,
  # digipeaters, igates/gateways, internet-only nodes and repeaters.
  # The neighbourhood map then shows actual ham stations only.
  exclude_infrastructure: true
