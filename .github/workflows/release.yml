name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, test, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Derive version from tag and cross-check VERSION file
        id: version
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $tag is not a semantic version like v0.1.0"
            exit 1
          fi
          # The VERSION file at the repository root is the canonical source
          # of truth: the tag must match it, so releases can never publish
          # a version that was not bumped intentionally.
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "::error::tag $tag != VERSION file '$file_version' (update the VERSION file at the repo root first)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: go vet ./... && go test -count=1 ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # Must mirror the `toolchain` directive in go.mod so the release
          # gate scans the same toolchain the build uses.
          go-version-input: '1.26.6'
          go-package: ./...

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/warnflux
          # Note: docker/metadata-action's semver {{version}} strips the
          # leading 'v'; the explicit v-prefix in the pattern keeps it.
          # No floating major tag before 1.0: 'v0' would silently cross
          # breaking minor releases.
          tags: |
            type=semver,pattern=v{{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ github.sha }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-linux-amd64 ./cmd/warnflux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-linux-arm64 ./cmd/warnflux

      - name: Build Windows binary
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ github.sha }}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/warnflux-windows-amd64.exe ./cmd/warnflux

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: WarnFlux v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          files: |
            dist/warnflux-linux-amd64
            dist/warnflux-linux-arm64
            dist/warnflux-windows-amd64.exe
            dist/SHA256SUMS

