# WarnFlux configuration example.
# Copy to config.yaml and adjust it for your environment.

app:
  # One of: debug, info, warn, error.
  log_level: info

  # Optional rotating log file; empty means log to stdout only.
  # In Docker, point this at the mounted volume, e.g. /logs/warnflux.log.
  log_file: ""

  # Rotate the log file once it grows beyond this size (megabytes).
  log_max_size_mb: 10

  # How many rotated log files to keep.
  log_max_backups: 5

  # How often to check for and mark expired events, e.g. 1m, 30s.
  expiration_interval: 1m

  # How long acknowledged journal records are kept before deletion,
  # e.g. 24h. Must be > 0.
  change_retention: 24h

  # How long cancelled/expired current-state records are kept in the
  # events table, e.g. 720h (30 days). Active events are never cleaned.
  event_retention: 720h

storage:
  # The only supported driver for now.
  driver: sqlite

  # Local development. If path is omitted entirely, WarnFlux warns and
  # creates warnflux.db next to the binary (dev/debug convenience).
  # In Docker, always set it explicitly, e.g. /data/warnflux.db.
  path: ./warnflux.db

# Source plugins: ingest hazard information and emit normalized events.
sources:
  # Open-Meteo INFORMATIONAL weather source: publishes ordinary weather
  # snapshots to retained MQTT information topics
  # (<topic_prefix>/info/openmeteo/<producer_id>/<location_id>/weather).
  # It does NOT generate HazardEvents. See
  # internal/plugins/sources/openmeteo/README.md and docs/weather-schema.md.
  - id: weather-home
    type: openmeteo
    enabled: false

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 15m
      request_timeout: 10s

      forecast_hours: 48
      forecast_days: 7

      # Free Open-Meteo API:
      api_key: ""
      api_key_file: ""

      locations:
        - id: home
          name: Home
          latitude: 50.0000
          longitude: 20.0000

  # IMGW-PIB public warnings: a real HAZARD source consuming the official
  # warningsmeteo and warningshydro feeds with full-snapshot disappearance
  # reconciliation (see internal/plugins/sources/imgw/README.md).
  # Data source: Instytut Meteorologii i Gospodarki Wodnej – Państwowy
  # Instytut Badawczy (IMGW-PIB); https://danepubliczne.imgw.pl/apiinfo.
  - id: imgw-warnings
    type: imgw
    enabled: true

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the data API base (testing/custom deployments).
      # base_url: https://danepubliczne.imgw.pl/api/data

      # Feeds to consume: meteo, hydro, or both. Omitted → both.
      feeds:
        - meteo
        - hydro

  # Regionalny System Ostrzegania (RSO) public XML communications:
  # a HAZARD source with upstream voivodeship filtering via the official
  # endpoint (see internal/plugins/sources/rso/README.md).
  # Source: RSO / TVP, https://www.komunikaty.tvp.pl/Info/Integration.
  - id: rso-malopolskie
    type: rso
    enabled: true

    runtime:
      restart: true
      shutdown_timeout: 10s

    config:
      poll_interval: 5m
      request_timeout: 10s

      # Optional: override the portal base (testing/custom deployments).
      # base_url: https://komunikaty.tvp.pl

      # One or more official RSO voivodeship slugs; omitted → [wszystkie].
      # "wszystkie" is exclusive (cannot be combined with regional slugs).
      voivodeships:
        - malopolskie

# Output plugins: receive meaningful event changes from the core.
outputs:
  # Publishes hazard event changes and an application status snapshot to
  # MQTT. This is the only built-in output.
  - id: mqtt-main
    type: mqtt
    enabled: false

    runtime:
      timeout: 10s
      failure_threshold: 5

    config:
      # Broker URL, e.g. tcp://localhost:1883 or ssl://broker.example.com:8883.
      broker: tcp://localhost:1883
      # Required: every WarnFlux instance needs its own client ID
      # (two instances sharing one will kick each other off the broker).
      client_id: warnflux-home
      username: ""
      # Plaintext password, mutually exclusive with password_file.
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""
      # Event changes are published to <topic_prefix>/events; the status
      # snapshot (retained) goes to <topic_prefix>/status.
      topic_prefix: warnflux
      # QoS for event messages: 1 or 2. QoS 0 is rejected because it would
      # downgrade hazard delivery to best effort.
      qos: 1
      # Interval between retained status snapshots, e.g. 30s. Set to 0 to
      # disable periodic status publication.
      heartbeat_interval: 30s

# Dispatch subsystem: one canonical bounded ingress plus independent MQTT
# receiver clients (INPUT). The receiver clients are deliberately separate
# from outputs[].type=mqtt (the Router publisher): the publisher delivers
# Router state/events to a broker, receivers consume MQTT frames for
# dispatch. They MAY connect to the same broker but MUST use different
# client IDs.
dispatch:
  # Bounded canonical dispatch intake queue; a full queue drops events
  # (counted and logged) until the durable rule engine exists.
  queue_size: 1024

  mqtt_receivers:

    # Local receiver: consumes the local WarnFlux MQTT contract and
    # arbitrary local topics through the same canonical ingress.
    - id: local
      enabled: true

      broker: tcp://mosquitto:1883
      client_id: warnflux-dispatch-local

      username: ""
      password: ""
      # Alternatively, read the password from a file (e.g. a Docker secret).
      # Mutually exclusive with password.
      password_file: ""

      connect_timeout: 10s
      keep_alive: 30s

      # WarnFlux protocol mode: automatically subscribes
      # <prefix>/events, <prefix>/active/#, <prefix>/info/#, <prefix>/status
      # and parses them with the strict wire protocol.
      warnflux:
        enabled: true
        topic_prefix: warnflux

      # Generic MQTT subscriptions (standard MQTT wildcard semantics).
      subscriptions:
        - topic: "home/#"
          qos: 1

# Authenticated admin web UI (server-rendered, embedded assets, no CDN).
web:
  enabled: true
  listen: ":8080"
  # The web UI includes a built-in /test page: any logged-in user can
  # emit a synthetic hazard transition (severity/urgency/certainty) into
  # the dispatch ingress to exercise the group routing paths.

  # Application name: browser title and footer.
  title: "WarnFlux"

  # System name shown next to the logo on the login page and in the
  # sidebar header. Defaults to the title.
  name: "WarnFlux"

  # Two-line branding shown next to the logo (sidebar) and on the login
  # page. header1 defaults to the name; header2 is an optional subtitle.
  header1: "SPOK"
  header2: "Społeczna Platforma Ostrzegania i Komunikacji"

  # Public domain this instance is served under (host, optional port).
  # Reserved for future absolute-link features; no scheme, no path.
  # Empty disables them.
  domain: "spok.example.com"

  auth:
    username: admin
    password: change-me
    # Alternatively, read the password from a file (e.g. a Docker secret).
    # Mutually exclusive with password.
    password_file: ""

    # Set to true when serving behind TLS (session cookie becomes Secure).
    secure_cookie: false

# ActionPlugins: explicitly invoked by the group routing rule engine
# (Groups page in the web UI). They never automatically receive MQTT
# events. Built-in types: logger (proof of concept), smtp (email).
actions:

  - id: logger-action
    type: logger
    enabled: false

    runtime:
      queue_size: 128
      call_timeout: 10s
      shutdown_timeout: 10s

    config:
      level: info

  # SMTP email action: sends one plain-text email per routed dispatch
  # event. Requires host, from and at least one recipient. STARTTLS is
  # attempted automatically (disable with starttls: false); AUTH PLAIN is
  # used when username is set. The password comes from password OR
  # password_file (Docker secrets), never both. ca_file appends a PEM CA
  # bundle for private servers with their own certificate authority.
  # - id: smtp-alerts
  #   type: smtp
  #   enabled: false
  #
  #   runtime:
  #     queue_size: 128
  #     call_timeout: 30s
  #     shutdown_timeout: 10s
  #
  #   config:
  #     host: smtp.example.com
  #     port: 587
  #     from: warnflux@example.com
  #     to: ["ops@example.com"]
  #     username: ""
  #     password: ""
  #     password_file: ""
  #     starttls: true
  #     ca_file: ""
  #     subject_prefix: "[WarnFlux]"
