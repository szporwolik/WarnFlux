# Host NTP client used ONLY as the WarnFlux fallback
# (docs/time-sync.md, warnflux-clock-guard.sh): when the station's discipline
# process is gone, systemd-timesyncd is started and keeps the host clock good
# from the ordinary pool. It is never pointed at the station's own server — the
# server and the station die together.
[Time]
NTP=pool.ntp.org
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org
