{{define "login"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{.AppTitle}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="/static/assets/logo.png" alt="WarnFlux logo">
    <h1>{{.AppTitle}}</h1>
    <p class="login-tagline">Alerts in. Action out.</p>
    <p class="muted" style="text-align:center">Admin sign in</p>
    {{if .Error}}<p class="login-error">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </main>
  <footer class="footer">
    <span>{{.AppTitle}} · {{.Version}} ({{if ne .Commit "unknown"}}<a class="commit-link" href="https://github.com/szporwolik/WarnFlux/commit/{{.Commit}}" target="_blank" rel="noopener noreferrer">{{.Commit}}</a>{{else}}{{.Commit}}{{end}})</span>
    <a class="footer-link" href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-github"></use></svg>github.com/szporwolik/WarnFlux</a>
  </footer>
</body>
</html>
{{end}}
