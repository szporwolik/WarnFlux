{{define "login"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{.AppTitle}}</title>
  <link rel="stylesheet" href="/static/style.css?v={{.Commit}}">
  <script>try{if(localStorage.getItem("warnflux-theme")==="light"){document.documentElement.setAttribute("data-theme","light")}}catch(e){}</script>
  <link rel="icon" href="/static/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="/static/assets/logo.png" alt="WarnFlux logo">
    <h1 class="login-name">{{.Header1}}</h1>
    {{if .Header2}}<p class="login-sub">{{.Header2}}</p>{{else}}<p class="login-tagline">Alerts in. Action out.</p>{{end}}
    {{if .Error}}<p class="login-error">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
    <p class="login-note">Account creation is disabled.</p>
    <p class="login-back"><a href="/">← Back to the public page</a></p>
  </main>
  {{template "footer" .}}
  {{if .About}}<dialog id="about-dialog" class="about-dialog">
    <button type="button" class="about-close" aria-label="Close">×</button>
    <div class="about-dialog-text">{{.About}}</div>
    <button type="button" class="about-ok btn-primary">Rozumiem</button>
  </dialog>{{end}}
  <script>
  (function () {
    var d = document.getElementById("about-dialog");
    if (!d) { return; }
    var seen = false;
    try { seen = localStorage.getItem("warnflux-about-seen") === "1"; } catch (e) {}
    var close = function () {
      try { localStorage.setItem("warnflux-about-seen", "1"); } catch (e) {}
      d.close();
    };
    var ok = d.querySelector(".about-ok");
    if (ok) { ok.addEventListener("click", close); }
    var x = d.querySelector(".about-close");
    if (x) { x.addEventListener("click", close); }
    d.addEventListener("click", function (e) { if (e.target === d) { close(); } });
    d.addEventListener("cancel", function (e) { e.preventDefault(); close(); });
    if (!seen) { d.showModal(); }
  })();
  </script>
</body>
</html>
{{end}}
